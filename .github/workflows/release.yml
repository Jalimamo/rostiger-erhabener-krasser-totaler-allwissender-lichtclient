name: Build and Release R.E.K.T.A.L.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux Release
        run: cargo build --release

      - name: Rename Binaries
        run: |
          cd target/release
          mv gui rektal_client
          mv kernel rektal_kernel

      - name: Create Tarball (.tar.gz)
        run: |
          cd target/release
          tar -czvf rektal-linux-x64.tar.gz rektal_client rektal_kernel

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/rektal-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-windows:
    name: Build Windows Setup & Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Release
        run: cargo build --release

      - name: Rename Binaries
        run: |
          cd target/release
          move gui.exe rektal_client.exe
          move kernel.exe rektal_kernel.exe

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows Setup to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            output_installer/Rektal-Setup-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Binaries
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS Release
        run: cargo build --release

      - name: Rename Binaries
        run: |
          cd target/release
          mv gui rektal_client
          mv kernel rektal_kernel

      - name: Create MacOS DMG Image
        run: |
          mkdir -p macos_dist
          cp target/release/rektal_client macos_dist/
          cp target/release/rektal_kernel macos_dist/
          hdiutil create -volname "R.E.K.T.A.L." -srcfolder macos_dist -ov -format UDZO Rektal-macOS.dmg

      - name: Upload macOS Assets to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Rektal-macOS.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}